<svg width="160" height="40" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spineGL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a6090"/>
      <stop offset="100%" stop-color="#3d2d58"/>
    </linearGradient>
    <linearGradient id="darkGL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3050"/>
      <stop offset="100%" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="purpGL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a6090"/>
      <stop offset="100%" stop-color="#3d2d58"/>
    </linearGradient>
    <filter id="shadowL">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#1a0f2e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- SPINE -->
  <rect x="2" y="4" width="9" height="32" rx="2" fill="url(#spineGL)" filter="url(#shadowL)"/>
  <rect x="2" y="4" width="4" height="32" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="6.5" y="1" width="1.6" height="3" rx="0.8" fill="#5a4976" opacity="0.5"/>
  <rect x="6.5" y="37" width="1.6" height="3" rx="0.8" fill="#5a4976" opacity="0.5"/>

  <!-- TOP ARM: dark candle -->
  <rect x="14" y="4" width="7" height="11" rx="2" fill="url(#darkGL)" filter="url(#shadowL)" opacity="0.88"/>
  <rect x="14" y="4" width="3" height="11" rx="2" fill="rgba(255,255,255,0.06)"/>
  <rect x="17" y="1" width="1.4" height="3" rx="0.7" fill="#1a1035" opacity="0.4"/>
  <!-- TOP ARM: purple candle -->
  <rect x="24" y="5" width="6" height="9" rx="2" fill="url(#purpGL)" filter="url(#shadowL)" opacity="0.85"/>
  <rect x="24" y="5" width="2.5" height="9" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="27" y="1.5" width="1.2" height="3.5" rx="0.6" fill="#5a4976" opacity="0.4"/>

  <!-- MID ARM: dark candle -->
  <rect x="14" y="19" width="7" height="10" rx="2" fill="url(#darkGL)" filter="url(#shadowL)" opacity="0.65"/>
  <rect x="14" y="19" width="3" height="10" rx="2" fill="rgba(255,255,255,0.04)"/>
  <rect x="17" y="15.5" width="1.4" height="3.5" rx="0.7" fill="#1a1035" opacity="0.25"/>
  <!-- MID ARM: purple candle -->
  <rect x="24" y="20" width="5" height="8" rx="2" fill="url(#purpGL)" filter="url(#shadowL)" opacity="0.6"/>
  <rect x="24" y="20" width="2" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="26.5" y="16.5" width="1.2" height="3.5" rx="0.6" fill="#5a4976" opacity="0.3"/>

  <!-- WORDMARK -->
  <text x="36" y="27"
    font-family="Outfit,Inter,system-ui,sans-serif"
    font-size="17" font-weight="800" letter-spacing="-0.4"
    fill="#0f0f14">Forward</text>
  <text x="103" y="27"
    font-family="Outfit,Inter,system-ui,sans-serif"
    font-size="17" font-weight="800" letter-spacing="-0.4"
    fill="#5a4976">Lab</text>
</svg>
